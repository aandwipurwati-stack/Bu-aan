<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buku Belajarku Kelas 2</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--c:#ff8a3d;--bg:#fff3d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;margin:0}
body{font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;background:var(--bg);color:#3a2a1a;display:flex;flex-direction:column;min-height:100svh;transition:background .4s}
#stage{flex:1;display:flex;align-items:center;justify-content:center;perspective:1400px;padding:clamp(8px,2vw,18px);min-height:0}
#page{width:100%;max-width:620px;min-height:min(68svh,500px);max-height:calc(100svh - 110px);background:#fffdf7;border-radius:12px 28px 28px 12px;border-left:12px solid var(--c);box-shadow:0 10px 0 rgba(0,0,0,.08),0 18px 30px rgba(0,0,0,.18);padding:clamp(16px,4vw,30px);overflow-y:auto;text-align:center;transform-origin:left center;position:relative;overscroll-behavior:contain}
#page.out{animation:out .28s ease-in forwards}#page.in{animation:in .32s ease-out}#page.outb{animation:outb .28s ease-in forwards}#page.inb{animation:inb .32s ease-out}
@keyframes out{to{transform:rotateY(-80deg);opacity:.2}}@keyframes in{from{transform:rotateY(60deg);opacity:.2}}@keyframes outb{to{transform:rotateY(80deg);opacity:.2}}@keyframes inb{from{transform:rotateY(-60deg);opacity:.2}}
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:99px;padding:2px 14px;font-weight:700;font-size:15px}.big{font-size:clamp(58px,12vw,84px);line-height:1.1;margin:8px 0;display:inline-block}
.bounce{animation:bounce 1.2s ease-in-out infinite}.wiggle{animation:wiggle 1s ease-in-out infinite}.float{animation:float 2.6s ease-in-out infinite}.spin{animation:spin 6s linear infinite}.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-18px)}}@keyframes wiggle{25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}@keyframes float{50%{transform:translateY(-10px) rotate(4deg)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes pulse{50%{transform:scale(1.18)}}
h1{font-size:clamp(24px,6vw,34px);margin:4px 0 10px;color:var(--c);font-weight:800;line-height:1.15}p,li{font-size:clamp(17px,4.5vw,20px);line-height:1.4;margin:7px 0}ul{list-style:none;padding:0;margin:8px 0;text-align:left}li{background:#fff;border:2px dashed var(--c);border-radius:14px;padding:8px 12px;margin:8px 0}.box{background:var(--bg);border-radius:16px;padding:10px 14px;margin:10px 0}.ingat{background:var(--c);color:#fff;border-radius:16px;padding:10px 14px;font-weight:700;font-size:18px;margin-top:12px}.row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;font-size:42px}.row span{display:inline-block}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}.menu button{width:100%;padding:12px;border:0;border-radius:18px;font:700 20px inherit;font-family:inherit;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.18);cursor:pointer}.menu button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
nav{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 14px max(12px,env(safe-area-inset-bottom));max-width:660px;width:100%;margin:0 auto}nav button{border:0;border-radius:99px;background:var(--c);color:#fff;font:800 22px inherit;font-family:inherit;min-width:64px;height:52px;box-shadow:0 4px 0 rgba(0,0,0,.2);cursor:pointer}nav button:disabled{opacity:.4;cursor:default}nav button:focus-visible,.menu button:focus-visible{outline:4px solid #3a2a1a;outline-offset:3px}#cnt{font-weight:700;font-size:17px;text-align:center;flex:1}
@media(max-width:420px){#page{min-height:0;max-height:calc(100svh - 100px);border-left-width:8px}nav{gap:7px;padding-inline:10px}nav button{min-width:54px;height:48px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style></head><body>
<main id="stage"><section id="page" aria-live="polite" aria-atomic="true" tabindex="-1"></section></main>
<nav><button id="home" aria-label="Daftar isi">🏠</button><button id="prev" aria-label="Halaman sebelumnya">◀</button><div id="cnt"></div><button id="next" aria-label="Halaman berikutnya">▶</button></nav>
<script>
var S={mt:["Matematika","#2f80ed","#e0efff"],pn:["Pancasila","#d63a3a","#ffe9d6"],bi:["Bahasa Indonesia","#e8505b","#ffe3e3"],pk:["PKLH","#27ae60","#dff7e6"],sb:["Seni Budaya","#9b51e0","#f1e4ff"],cv:["","#ff8a3d","#fff3d6"]};
var P=[
["cv","📚","float","Buku Belajarku Kelas 2","<p>Rangkuman materi Penilaian Sumatif Akhir Semester Ganjil</p><p><b>SD Negeri 011 Balikpapan Timur</b><br>Tahun Pelajaran 2026/2027</p><div class='row'><span class='bounce'>🐘</span><span class='wiggle'>🎨</span><span class='bounce' style='animation-delay:.3s'>🔢</span><span class='wiggle'>🌟</span></div><div class='ingat'>Geser layar atau tekan ▶ untuk membalik halaman!</div>"],
["cv","🏠","bounce","Pilih Pelajaran","MENU"],
["mt","🔢","bounce","Bilangan sampai 999","<ul><li>Tiga ratus empat puluh lima = <b>345</b></li><li>Pada <b>345</b>: 3 = ratusan (300), 4 = puluhan (40), 5 = satuan (5)</li><li>Loncat 5: 5, 10, 15, 20 → loncatnya <b>5</b></li></ul>"],
["mt","➕","pulse","Tambah dan Kurang","<div class='box'>120 + 235 + 140 = <b>495</b></div><div class='box'>500 – 230 + 100 = <b>370</b></div><p>Soal cerita: kerjakan <b>berurutan</b> dari depan 📝</p><div class='ingat'>Susun ke bawah, mulai dari satuan!</div>"],
["mt","🥚","wiggle","Pecahan","<ul><li>½ dari 10 🍎 = <b>5</b> 🍎 (dibagi 2)</li><li>⅛ dari 16 orang = <b>2</b> orang (dibagi 8)</li><li>🥚 8 telur, 3 pecah → <b>3/8</b> pecah</li><li>Sisa = jumlah semua – yang diambil</li></ul>"],
["mt","⏰","spin","Volume dan Waktu","<ul><li>🥛 Volume diukur dalam <b>mL</b> atau gelas (tidak baku)</li><li>200 mL + 300 mL = <b>500 mL</b></li><li>⏰ 1 jam = <b>60 menit</b></li><li>Mulai 07.00, selesai 09.30 → <b>2 jam 30 menit</b></li></ul>"],
["mt","📏","float","Panjang dan Berat","<ul><li>📎 Panjang diukur dengan klip: <b>5 klip</b></li><li>Bandingkan: ✏️ lebih panjang dari 🖍️?</li><li>🍉 semangka lebih <b>berat</b> dari 🍊 jeruk</li></ul><div class='ingat'>Paling berat = yang paling besar bebannya</div>"],
["pn","⭐","spin","Simbol Sila","<ul><li>⭐ Sila 1: bintang</li><li>⛓️ Sila 2: <b>Kemanusiaan yang adil dan beradab</b> (rantai)</li><li>🌳 Sila 3: pohon beringin</li><li>🐂 Sila 4: kepala <b>banteng</b></li><li>🌾 Sila 5: padi dan kapas</li></ul><p>Bintang emas = percaya pada Tuhan ✨</p>"],
["pn","🤝","bounce","Menerapkan Pancasila","<ul><li>Beda pendapat? <b>Dengarkan</b> dan <b>hargai</b> teman 👂</li><li>Musyawarah → sila ke-4</li><li>💰 Hemat uang jajan: <b>menabung</b> dan tidak boros</li></ul>"],
["pn","🏡","wiggle","Aturan di Rumah","<ul><li>Aturan rumah dibuat oleh <b>orang tua</b></li><li>🌅 Pagi: bangun, mandi, sarapan</li><li>🚪 Sebelum bermain: <b>izin</b> orang tua</li><li>📺 Matikan TV: hemat listrik dan bisa belajar</li><li>🌙 Sebelum tidur: sikat gigi dan berdoa</li></ul>"],
["pn","🏫","bounce","Aturan di Sekolah","<ul><li>Bicara dengan guru: <b>sopan</b>, pelan</li><li>👕 Berpakaian: seragam <b>rapi</b></li><li>Bertemu guru: <b>salam</b> dan salim 🙏</li><li>🇮🇩 Upacara bendera: melatih <b>disiplin</b> dan cinta tanah air</li></ul>"],
["bi","👀","bounce","Memirsa: Gambar, Rambu, Grafik","<ul><li>😊 Lihat wajah: senang, sedih, marah</li><li>📊 Grafik: batang tertinggi = <b>paling banyak</b> disukai</li><li>🚸 Rambu memberi <b>informasi</b> atau peringatan</li></ul>"],
["bi","📖","float","Makna Kata dan Kekerabatan","<ul><li>📕 Mencari arti kata: <b>kamus</b></li><li>Anak <b>bungsu</b> = anak yang paling kecil (terakhir)</li><li><b>Abang</b> = kakak laki-laki</li><li>🥄 Sendok: untuk makan</li></ul>"],
["bi","🥋","wiggle","Teks Informasi","<ul><li>Fakta = hal yang <b>benar adanya</b></li><li>Seni bela diri punya negara asal, misalnya karate dari Jepang 🇯🇵, taekwondo dari Korea 🇰🇷</li><li>🖼️ Teks bergambar membantu kita paham informasi</li></ul>"],
["bi","✍️","pulse","Berbicara dan Menulis","<ul><li>🙏 Minta maaf: <b>Maaf ya</b></li><li>🤩 Kagum: <b>Wah, indah sekali!</b></li><li>Huruf besar: awal kalimat dan <b>nama orang</b> (Budi)</li><li>Akhir kalimat: . ? !</li><li>Pasif: menulis → <b>di</b>tulis, membaca → <b>di</b>baca</li></ul>"],
["pk","🛁","bounce","Kebersihan dan Kesehatan Diri","<ul><li>🚿 Mandi <b>2 kali</b> sehari</li><li>🧼 Alat mandi: sabun, sampo, handuk</li><li>✂️ Juga: cuci tangan, potong kuku</li><li>🥤 Minum air putih <b>8 gelas</b> sehari</li><li>👅 Lidah untuk mengecap rasa</li></ul>"],
["pk","🥗","wiggle","Hidup Sehat","<ul><li>PHBS: makan makanan <b>bergizi</b> 🥦</li><li>🥚🐟 Protein: telur, ikan, tempe</li><li>🤒 Hidup kotor bisa sakit: diare, gatal</li><li>🦀 Bonting/abon kepiting: makanan khas Kalimantan Timur</li></ul>"],
["pk","♻️","spin","Lingkungan dan Sampah","<ul><li>Bersih = sehat dan nyaman 🌈</li><li>Selokan dibersihkan agar air <b>lancar</b>, tidak banjir</li><li>🍂 Organik (sisa tumbuhan, makanan) → tempat <b>hijau</b></li><li>🧴 Anorganik (plastik, kaca, botol) → tempat <b>kuning</b></li></ul>"],
["sb","🎨","wiggle","Seni Rupa","<ul><li>Tiga warna dasar: <b>merah, kuning, biru</b></li><li>Titik: besar atau kecil (ukuran)</li><li>Karya 3D punya <b>panjang, lebar, tinggi</b></li><li>Karya 2D dilihat dari <b>depan</b></li></ul>"],
["sb","🎻","float","Bunyi dan Musik","<ul><li>🐱 Kucing: <b>meong</b></li><li>🎻 Biola: <b>digesek</b></li><li>🎋 Angklung: <b>digoyang</b></li><li>🎈 Lagu Balonku: birama <b>2/4</b></li><li>Bunyi panjang = garis not yang panjang</li></ul>"],
["sb","💃","bounce","Tari dan Pantomim","<ul><li>Tari lebih menarik dengan <b>iringan musik</b> 🎶</li><li>Ide dasar tari = <b>tema</b></li><li>🤫 Pantomim: pertunjukan <b>tanpa suara</b>, hanya gerak dan wajah</li><li>Orang mahir seni: <b>seniman</b> 🌟</li></ul><div class='ingat'>Selamat belajar dan semoga sukses SAS! 🌟</div>"]
];
var i=0,pg=document.getElementById('page'),busy=false;
function render(){var p=P[i],s=S[p[0]];
document.documentElement.style.setProperty('--c',s[1]);document.documentElement.style.setProperty('--bg',s[2]);
var h=(s[0]?"<span class='tag'>"+s[0]+"</span><br>":"")+"<span class='big "+p[2]+"'>"+p[1]+"</span><h1>"+p[3]+"</h1>";
if(p[4]=="MENU"){h+="<div class='menu'>"+[["mt",2],["pn",7],["bi",11],["pk",15],["sb",18]].map(function(m){return "<button style='background:"+S[m[0]][1]+"' data-g='"+(m[1]+1)+"'>"+S[m[0]][0]+"</button>"}).join("")+"</div>"}else h+=p[4];
pg.innerHTML=h;pg.scrollTop=0;
document.getElementById('cnt').textContent=(i+1)+" / "+P.length;
document.getElementById('prev').disabled=i==0;document.getElementById('next').disabled=i==P.length-1;
pg.querySelectorAll('[data-g]').forEach(function(b){b.onclick=function(){go(+b.dataset.g-1)}})}
function go(n){if(busy||n<0||n>=P.length||n==i)return;busy=true;var f=n>i;pg.className=f?'out':'outb';
setTimeout(function(){i=n;render();pg.className=f?'in':'inb';setTimeout(function(){pg.className='';busy=false},330)},280)}
document.getElementById('next').onclick=function(){go(i+1)};
document.getElementById('prev').onclick=function(){go(i-1)};
document.getElementById('home').onclick=function(){go(1)};
var x0=null;document.addEventListener('touchstart',function(e){x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>50)go(i+(d<0?1:-1));x0=null});
document.addEventListener('keydown',function(e){if(e.key=='ArrowRight')go(i+1);if(e.key=='ArrowLeft')go(i-1)});
render();
</script></body></html>
